apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: aibatches.ai.mini
spec:
  group: ai.mini
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                tenant:
                  type: string
                modelHint:
                  type: string
                workload:
                  type: string
                gpuCount:
                  type: integer
                batchSize:
                  type: integer
                tokensTargetPerSec:
                  type: integer
                priorityClass:
                  type: string
  scope: Namespaced
  names:
    plural: aibatches
    singular: aibatch
    kind: AIBatch
    shortNames:
      - aib